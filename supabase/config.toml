[analytics]
enabled = false

# AI tutor — generates step-by-step hints for problems via Gemini.
#
# `verify_jwt = false` because Supabase's gateway-level verification
# rejects CORS preflight (OPTIONS) and any browser request that doesn't
# carry the JWT in the way Kong expects, returning 401 before our handler
# runs. The function still verifies the user's JWT itself by calling
# `userClient.auth.getUser()` early and returning 401 on failure, so this
# isn't a security regression.
[functions.ai-hint]
verify_jwt = false

# Auto-explain wrong answers — same JWT-in-handler approach as ai-hint.
[functions.ai-explain]
verify_jwt = false