# Branded email templates (Kazakh, AtomEdu look & feel).
# Subjects + HTML are versioned in supabase/templates/.
# Locally `supabase start` picks these up. For prod copy the HTML into
# Dashboard → Authentication → Email Templates, OR run
# `supabase config push` (CLI ≥ 1.180) to sync the [auth.*] sections.
[auth.email.template.confirmation]
subject = "AtomEdu — email-ыңызды растаңыз"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "AtomEdu — құпиясөзді қалпына келтіру"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "AtomEdu — кіру сілтемесі"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "AtomEdu — жаңа email-ды растау"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "AtomEdu курсына шақыру"
content_path = "./supabase/templates/invite.html"

[auth.external.google]
enabled = false
# Раскомментируйте и добавьте ваши credentials после создания OAuth приложения в Google Cloud Console
# client_id = "your-client-id.apps.googleusercontent.com"
# secret = "your-client-secret"

[analytics]
enabled = false

# AI tutor — generates step-by-step hints for problems via Gemini.
#
# `verify_jwt = false` because Supabase's gateway-level verification
# rejects CORS preflight (OPTIONS) and any browser request that doesn't
# carry the JWT in the way Kong expects, returning 401 before our handler
# runs. The function still verifies the user's JWT itself by calling
# `userClient.auth.getUser()` early and returning 401 on failure, so this
# isn't a security regression.
[functions.ai-hint]
verify_jwt = false

# Auto-explain wrong answers — same JWT-in-handler approach as ai-hint.
[functions.ai-explain]
verify_jwt = false

# AI lab grader (teacher-only). JWT verified in handler.
[functions.ai-grade-lab]
verify_jwt = false

# AI re-grader for a single problem_attempt (student-callable as fallback
# when the strict auto-grade returned false). JWT verified in handler.
[functions.ai-grade-answer]
verify_jwt = false